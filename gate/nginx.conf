# The gate (28.11.2026): the one door of the hub. It always runs, takes every request (from the tunnel and from the
# home network) and passes it to the web service. When the web service does not answer (restart, stopped, a backup
# being put back), it shows the maintenance page instead. Only the services behind it restart or stop (hubctl).
# Runs as nginx's own user without rights, read-only, everything it writes in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's own name server: the web service gets a new address when it is made again; a name it can not find
    # yet (the hub still starting) is a 502, which the maintenance page answers, instead of a gate that does not start.
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }   # the shell of a device is a WebSocket

    server {
        listen 8000;
        client_max_body_size 0;          # the hub limits uploads itself (serversettings)
        proxy_request_buffering off;     # uploads and downloads stream through, nothing piles up here
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            set $hub http://hub-web:8000;
            proxy_pass $hub;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # Who really asked (the tunnel or a visitor in the home network): the web service sees only the gate.
            # Always set here, so nobody can send it himself (web/app/throttle.py).
            proxy_set_header X-Hub-Peer $remote_addr;
        }

        # Only the gate's own errors (the web service unreachable), never an answer of the hub itself.
        error_page 502 503 504 =503 @down;
        location @down {
            root /etc/nginx/hub;
            default_type text/html;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "15" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
            try_files /maintenance.html =503;
        }
    }
}
