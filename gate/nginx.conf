# The gate (28.11.2026): the one door of the hub. It always runs, takes every request (from the tunnel and from the
# home network) and passes it to the web service. When the web service does not answer (restart, stopped, a backup
# being put back), it shows the maintenance page instead. Only the services behind it restart or stop (hubctl).
# Runs as nginx's own user without rights, read-only, everything it writes in /tmp. What both doors do is in
# hub.conf; the HTTPS door for a server with its own public IP in tls.conf.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker's own name server: the web service gets a new address when it is made again; a name it can not find
    # yet (the hub still starting) is a 502, which the maintenance page answers, instead of a gate that does not start.
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }   # the shell of a device is a WebSocket

    # The hub's own door: the home network, the tunnel and the server's port. Never HTTPS here, so a visitor can not
    # claim it ($hub_https empty: the header is not passed).
    server {
        listen 8000;
        set $hub_https "";
        include /etc/nginx/hub/hub.conf;
    }

    # HTTPS with a Cloudflare origin certificate (28.11.2026, a server with its own public IP): on only when the
    # set-up saved a certificate; hubctl then writes /etc/nginx/tls/enable.on, which includes hub/tls.conf.
    include /etc/nginx/tls/*.on;
}
