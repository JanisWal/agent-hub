# What every door of the gate does (included by nginx.conf and tls.conf): pass the request to the web service, stream
# uploads and downloads, and show the maintenance page when the web service does not answer.
client_max_body_size 0;          # the hub limits uploads itself (serversettings)
proxy_request_buffering off;     # uploads and downloads stream through, nothing piles up here
proxy_buffering off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

location / {
    set $hub http://hub-web:8000;
    proxy_pass $hub;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Who really asked (the tunnel, a visitor in the home network, or behind Cloudflare the visitor it names): the
    # web service sees only the gate. Always set here, so nobody can send it himself (web/app/throttle.py).
    proxy_set_header X-Hub-Peer $remote_addr;
    # "1" only at the HTTPS door (deps.is_https); empty means the header is not passed at all.
    proxy_set_header X-Hub-Https $hub_https;
}

# Only the gate's own errors (the web service unreachable), never an answer of the hub itself.
error_page 502 503 504 =503 @down;
location @down {
    root /etc/nginx/hub;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "15" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:" always;
    try_files /maintenance.html =503;
}
