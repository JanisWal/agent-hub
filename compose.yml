services:
  web:
    build: ./web
    ports:
      - "127.0.0.1:8000:8000"   # only the Pi itself; the tunnel reaches the hub over the Docker network
    volumes:
      - ./data:/data
    environment:
      HUB_SECURE_COOKIE: "1"     # the site is served over HTTPS by Cloudflare
      # Mail (password reset). Values come from .env next to this file; empty = mail features off.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      HUB_BASE_URL: "${HUB_BASE_URL:-}"
      # SHA-256 of the runner's token (the runner itself holds the token). Empty = runner interface off.
      HUB_RUNNER_TOKEN_HASH: "${HUB_RUNNER_TOKEN_HASH:-}"
    restart: unless-stopped
    networks:
      default: {}
      web:
        aliases: [agent-hub]     # the tunnel's route points to http://agent-hub:8000

  # The runner signs users in to Claude and (later) starts one container per agent run through the
  # Docker socket. It is the only service with that socket, and the only one that sees the Claude
  # folders of the users: they live outside ./data on purpose, so the web service cannot see them.
  # Needs RUNNER_TOKEN in .env (and its SHA-256 as HUB_RUNNER_TOKEN_HASH for web); see KONZEPT-AGENTEN.md.
  runner:
    image: agent-hub-hub-runner      # own name: "agent-hub-runner" belongs to the old runner in /opt/agent-hub
    build:
      context: .
      dockerfile: runner/Dockerfile.runner
    environment:
      HUB_URL: "http://web:8000"
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
      HUB_CLAUDE_DIR: "${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}"   # same path inside and outside: the Docker daemon mounts host paths
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}:${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}"
    networks:
      - default
    depends_on:
      - web
    restart: unless-stopped

  # The only way out of the agent network (see runner/egress.py): the agent containers have no route to the
  # outside, they reach the internet only through this filtering proxy (web: public hosts only, never the home
  # network; api: only Anthropic). Same image as the runner, no secrets, no Docker socket, no volumes.
  egress:
    image: agent-hub-hub-runner
    pull_policy: never
    command: ["python", "-u", "-m", "runner.egress"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    networks:
      default: {}
      agents:
        aliases: [egress]
    depends_on:
      - runner
    restart: unless-stopped

networks:
  web:
    external: true
  agents:                          # the network of the agent containers: no route anywhere except to "egress"
    name: agent-hub-agents
    internal: true
