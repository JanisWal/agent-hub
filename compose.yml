services:
  web:
    build: ./web
    # Own user, no extra rights, a memory limit (15.11.2026): ./data belongs to 9000 (deploy/restore.sh sets it).
    # 9000 is outside the run users (10000+id) and the egress proxy (65534).
    user: "9000:9000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    ports:
      - "127.0.0.1:8000:8000"   # only the Pi itself; the tunnel reaches the hub over the Docker network
    volumes:
      - ./data:/data
    environment:
      HUB_SECURE_COOKIE: "1"     # the site is served over HTTPS by Cloudflare
      # Mail (password reset). Values come from .env next to this file; empty = mail features off.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      HUB_BASE_URL: "${HUB_BASE_URL:-}"
      # SHA-256 of the runner's token (the runner itself holds the token). Empty = runner interface off.
      HUB_RUNNER_TOKEN_HASH: "${HUB_RUNNER_TOKEN_HASH:-}"
    restart: unless-stopped
    healthcheck:                 # `docker compose ps` shows "healthy"; python is in the image, curl is not
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      default: {}
      web:
        aliases: [agent-hub]     # the tunnel's route points to http://agent-hub:8000

  # The runner signs users in to Claude and starts one container per question or agent run through the
  # Docker socket. It is the only service with that socket, the only one with the key of the saved Claude tokens
  # (HUB_TOKEN_KEY) and the only one that sees the folders with those encrypted tokens: they live outside ./data on
  # purpose, so the web service cannot see them. Needs RUNNER_TOKEN and HUB_TOKEN_KEY in .env (and the SHA-256 of
  # RUNNER_TOKEN as HUB_RUNNER_TOKEN_HASH for web); see KONZEPT-AGENTEN.md and runner/tokens.py.
  runner:
    image: agent-hub-hub-runner      # not "agent-hub-runner": that was the old runner (removed 13.11.2026)
    build:
      context: .
      dockerfile: runner/Dockerfile.runner
    environment:
      HUB_URL: "http://web:8000"
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
      HUB_CLAUDE_DIR: "${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}"   # same path inside and outside: the Docker daemon mounts host paths
      HUB_TOKEN_KEY: "${HUB_TOKEN_KEY:-}"
      HUB_TICKETS_DIR: /tickets
      HUB_WORK_DIR: "${HUB_WORK_HOST_DIR:-/opt/agent-hub/work}"   # the projects' code and the tasks' folders (runner/workspace.py)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HUB_WORK_HOST_DIR:-/opt/agent-hub/work}:${HUB_WORK_HOST_DIR:-/opt/agent-hub/work}"
      - "${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}:${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}"
      - tickets:/tickets
    networks:
      - default
    depends_on:
      - web
    restart: unless-stopped

  # The only way out of the agent network (see runner/egress.py): the agent containers have no route to the
  # outside, they reach the internet only through this filtering proxy (web: public hosts only, never the home
  # network; api: only Anthropic; gateway: the Claude API with the user's token put in, runner/tokens.py). Same image
  # as the runner, no Docker socket, no key; it only reads the tickets of running runs (a folder in memory).
  egress:
    image: agent-hub-hub-runner
    pull_policy: never
    command: ["python", "-u", "-m", "runner.egress"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    environment:
      HUB_TICKETS_DIR: /tickets
    volumes:
      - tickets:/tickets:ro
    networks:
      default: {}
      agents:
        aliases: [egress]
    depends_on:
      - runner
    restart: unless-stopped

# The tickets of running runs (runner/tokens.py): in memory only (tmpfs), never on the SD card or in a backup.
# Only the runner (writes) and the egress proxy (reads) mount it; the runs and the web service do not.
volumes:
  tickets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0711"

networks:
  web:
    external: true
  agents:                          # the network of the agent containers: no route anywhere except to "egress"
    name: agent-hub-agents
    internal: true
