# Every place, port and budget comes from .env (27.11.2026, deploy/steps/40-env.sh writes it for a new install); the
# defaults are the values of the first hub (the Raspberry Pi at /opt/agent-hub/workspaces/agent-hub), so it runs
# unchanged. The project's name keeps container and image names apart from other programs on the same Docker.
name: ${HUB_NAME:-agent-hub}

services:
  web:
    build: ./web
    # Own user, no extra rights, a memory limit (15.11.2026): ./data belongs to 9000 (deploy/restore.sh sets it).
    # 9000 is outside the run users (10000+id) and the egress proxy (65534).
    user: "9000:9000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${HUB_WEB_MEM:-256m}
    # No port of its own (28.11.2026): every request comes through the gate below, which shows the maintenance page
    # while this service restarts or is stopped.
    volumes:
      - ${HUB_DATA_HOST_DIR:-./data}:/data
      - ${HUB_BACKUP_HOST_DIR:-/opt/agent-hub/hub-backups}:/backups:ro   # listing and downloading backups (backups.py)
      - /etc/localtime:/etc/localtime:ro                                 # the server's clock zone (the nightly backup)
    environment:
      # "1": only HTTPS (the first hub, behind Cloudflare); "auto": HTTPS through the tunnel and plain HTTP at the
      # server's address in the home network (deps.is_https).
      HUB_SECURE_COOKIE: "${HUB_SECURE_COOKIE:-1}"
      HUB_TRUSTED_PROXY: "${HUB_TRUSTED_PROXY:-}"   # the tunnel's name: only its forwarded headers count (throttle.py)
      HUB_TUNNEL_ON: "${TUNNEL_TOKEN:+1}"           # the set-up says whether a tunnel is set; the token stays out
      HUB_GATE: "gate"                              # requests come through the gate; it names the real peer (throttle.py)
      # Mail (password reset). Values come from .env next to this file; empty = mail features off.
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      HUB_BASE_URL: "${HUB_BASE_URL:-}"
      # SHA-256 of the runner's token (the runner itself holds the token). Empty = runner interface off.
      HUB_RUNNER_TOKEN_HASH: "${HUB_RUNNER_TOKEN_HASH:-}"
      # Public age key for secrets kept in the database (device keys and passwords, web/app/vault.py): the web service
      # can only lock them away; the private key is only in the broker. Empty = no secrets can be stored.
      HUB_VAULT_PUBLIC: "${HUB_VAULT_PUBLIC:-}"
      # The broker (SSH to the devices): its address in the network "devices" and the shared token.
      HUB_BROKER_URL: "broker:7000"
      HUB_BROKER_TOKEN: "${HUB_BROKER_TOKEN:-}"
    restart: unless-stopped
    healthcheck:                 # `docker compose ps` shows "healthy"; python is in the image, curl is not
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      default:
        aliases: [hub-web]       # the gate passes everything here
      devices: {}                # only to reach the broker

  # The runner signs users in to Claude and starts one container per question or agent run through the
  # Docker socket. It is the only service with that socket, the only one with the key of the saved Claude tokens
  # (HUB_TOKEN_KEY) and the only one that sees the folders with those encrypted tokens: they live outside ./data on
  # purpose, so the web service cannot see them. Needs RUNNER_TOKEN and HUB_TOKEN_KEY in .env (and the SHA-256 of
  # RUNNER_TOKEN as HUB_RUNNER_TOKEN_HASH for web); see KONZEPT-AGENTEN.md and runner/tokens.py.
  runner:
    image: agent-hub-hub-runner      # not "agent-hub-runner": that was the old runner (removed 13.11.2026)
    build:
      context: .
      dockerfile: runner/Dockerfile.runner
    environment:
      HUB_URL: "http://web:8000"
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
      HUB_CLAUDE_DIR: "${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}"   # same path inside and outside: the Docker daemon mounts host paths
      HUB_TOKEN_KEY: "${HUB_TOKEN_KEY:-}"
      HUB_TICKETS_DIR: /tickets
      HUB_WORK_DIR: "${HUB_WORK_HOST_DIR:-/opt/agent-hub/work}"   # the projects' code and the tasks' folders (runner/workspace.py)
      HUB_FILES_SOURCE: /hub-files   # the hub's file storage, read-only: copied into each job's /files (runner/view.py)
      # The places runner/hubctl.py works in (backup, putting one back, settings in .env), host paths; app, data,
      # claude and work lie inside the base folder.
      HUB_NAME: "${HUB_NAME:-agent-hub}"
      HUB_BASE_HOST_DIR: "${HUB_BASE_HOST_DIR:-/opt/agent-hub}"
      HUB_APP_HOST_DIR: "${HUB_APP_HOST_DIR:-/opt/agent-hub/workspaces/agent-hub}"
      HUB_DATA_HOST_DIR: "${HUB_DATA_HOST_DIR:-/opt/agent-hub/workspaces/agent-hub/data}"
      HUB_BACKUP_HOST_DIR: "${HUB_BACKUP_HOST_DIR:-/opt/agent-hub/hub-backups}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${HUB_WORK_HOST_DIR:-/opt/agent-hub/work}:${HUB_WORK_HOST_DIR:-/opt/agent-hub/work}"
      - "${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}:${HUB_CLAUDE_HOST_DIR:-/opt/agent-hub/claude}"
      - tickets:/tickets
      - ${HUB_DATA_HOST_DIR:-./data}/files:/hub-files:ro
    networks:
      - default
    depends_on:
      - web
    restart: unless-stopped

  # The only way out of the agent network (see runner/egress.py): the agent containers have no route to the
  # outside, they reach the internet only through this filtering proxy (web: public hosts only, never the home
  # network; api: only Anthropic; gateway: the Claude API with the user's token put in, runner/tokens.py). Same image
  # as the runner, no Docker socket, no key; it only reads the tickets of running runs (a folder in memory).
  egress:
    image: agent-hub-hub-runner
    pull_policy: never
    command: ["python", "-u", "-m", "runner.egress"]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${HUB_EGRESS_MEM:-96m}
    environment:
      HUB_TICKETS_DIR: /tickets
    volumes:
      - tickets:/tickets:ro
    networks:
      default: {}
      agents:
        aliases: [egress]
    depends_on:
      - runner
    restart: unless-stopped

  # The broker (broker/broker.py, 17.11.2026): the only service that opens SSH connections to devices and the only one
  # with the private age key that opens their secrets (HUB_VAULT_IDENTITY). Its own network "devices", shared only with
  # the web service: the runner, the egress proxy and the AI runs can not reach it. That network is a normal bridge
  # with a way out, so the broker reaches the home network; which addresses it may connect to, it checks itself
  # (private ones only for devices the owner approved, never the Docker networks or the server's own services).
  # No port is published, no Docker socket, no data folder.
  broker:
    build:
      context: .
      dockerfile: broker/Dockerfile
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${HUB_BROKER_MEM:-128m}
    environment:
      HUB_BROKER_TOKEN: "${HUB_BROKER_TOKEN:-}"
      HUB_VAULT_IDENTITY: "${HUB_VAULT_IDENTITY:-}"
    networks:
      - devices
    restart: unless-stopped

  # The gate (28.11.2026, gate/nginx.conf): the one door of the hub, always running. It passes every request to the web
  # service and shows the maintenance page (gate/maintenance.html) while that does not answer. Restart and stop
  # (hubctl) touch only the services behind it. nginx's own user, no rights, read-only, its scratch in memory.
  gate:
    image: nginx:1.27.5-alpine
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${HUB_GATE_MEM:-32m}
    tmpfs: ["/tmp:size=16m"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      # The first hub: only the Pi itself (the tunnel reaches the gate over the Docker network). A new install opens it
      # in the home network (HUB_BIND=0.0.0.0) for the set-up assistant and for use at the server's address.
      - "${HUB_BIND:-127.0.0.1}:${HUB_PORT:-8000}:8000"
    volumes:
      - ./gate/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gate/maintenance.html:/etc/nginx/hub/maintenance.html:ro
    networks:
      default: {}
      web:
        aliases: [agent-hub]     # the tunnel's route points to http://agent-hub:8000
    restart: unless-stopped

  # The Cloudflare tunnel of a new install (27.11.2026): it runs when .env has TUNNEL_TOKEN and COMPOSE_PROFILES=tunnel
  # (the set-up assistant writes both, runner/hubctl.py). The first hub keeps its own tunnel outside this file. Fixed
  # version (CLAUDE.md); the token comes from the environment, so it is not on the command line.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:-}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    networks:
      web:
        aliases: [tunnel]
    depends_on:
      - gate
    restart: unless-stopped

# The tickets of running runs (runner/tokens.py): in memory only (tmpfs), never on the SD card or in a backup.
# Only the runner (writes) and the egress proxy (reads) mount it; the runs and the web service do not.
volumes:
  tickets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0711"

networks:
  web:
    name: ${HUB_WEB_NETWORK:-web}   # made by the installer (deploy/steps/50-build.sh); shared with the tunnel
    external: true
  devices:                         # web <-> broker only; the broker's way to the devices (17.11.2026)
    name: agent-hub-devices
  agents:                          # the network of the agent containers: no route anywhere except to "egress"
    name: agent-hub-agents
    internal: true
